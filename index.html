<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FEF7FF">
<title>My Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c1a17'/><text y='.85em' font-size='65' x='18' fill='white' font-family='sans-serif' font-weight='bold'>✓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Material Design 3 (stock Android) */
  :root {
    --primary:                   #6750A4;
    --on-primary:                #FFFFFF;
    --primary-container:         #EADDFF;
    --on-primary-container:      #21005D;
    --secondary-container:       #E8DEF8;
    --on-secondary-container:    #1D192B;
    --surface:                   #FEF7FF;
    --surface-low:               #F7F2FA;
    --surface-mid:               #F3EDF7;
    --surface-high:              #ECE6F0;
    --on-surface:                #1D1B20;
    --on-surface-variant:        #49454F;
    --outline:                   #79747E;
    --outline-variant:           #CAC4D0;
    --error:                     #B3261E;
    --low:        #386A20;  --low-c:  #C4EFAF;  --on-low-c:  #0A2100;
    --mid:        #8B5000;  --mid-c:  #FFDCBE;  --on-mid-c:  #2C1600;
    --high:       #B3261E;  --high-c: #F9DEDC;  --on-high-c: #410E0B;
    --accent:     var(--primary);
    --radius:     16px;
    --radius-sm:  12px;
    --ease:       cubic-bezier(0.2, 0, 0, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: Fredoka, system-ui, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; }
  .container {
    position: relative;
    z-index: 1;
    background: var(--surface);
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    padding: 1.5rem 1rem 1.5rem;
  }

  /* ── Top app bar ── */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 0 0.5rem;
    margin-bottom: 1rem;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 600;
    line-height: 2.5rem;
    color: var(--on-surface);
  }
  .header .date {
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.1px;
    color: var(--on-surface-variant);
    margin-top: 2px;
  }
  .clock-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
    min-width: 96px;
    padding-top: 8px;
  }
  .clock-time {
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.1px;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .seconds-bar-track {
    width: 100%;
    height: 4px;
    background: var(--secondary-container);
    border-radius: 2px;
    overflow: hidden;
  }
  .seconds-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    border-radius: 2px;
    transition: width 0.95s linear;
  }

  /* ── Ripple (touch feedback) ── */
  .app-tab, .priority-btn, .filter-btn, .ghost-btn, .add-btn, .note-add-row,
  .toast-undo, .note-filter-btn, li, .note-row { position: relative; overflow: hidden; }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.14;
    transform: scale(0);
    animation: ripple 0.55s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ripple { display: none; } }

  /* ── Primary tabs ── */
  .app-tabs {
    display: flex;
    width: 100%;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--outline-variant);
  }
  .app-tab {
    flex: 1;
    height: 48px;
    border: none;
    background: transparent;
    color: var(--on-surface-variant);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.1px;
    cursor: pointer;
    transition: color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .app-tab::after {
    content: '';
    position: absolute;
    left: 25%;
    right: 25%;
    bottom: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: var(--primary);
    transform: scaleX(0);
    transition: transform 0.25s var(--ease);
  }
  .app-tab:hover { background: rgba(29, 27, 32, 0.06); }
  .app-tab.active { color: var(--primary); }
  .app-tab.active::after { transform: scaleX(1); }

  /* ── Task input (filled, pill) ── */
  .input-wrap {
    position: relative;
    margin-bottom: 0.75rem;
  }
  .input-wrap input[type="text"] {
    width: 100%;
    height: 56px;
    padding: 0 64px 0 20px;
    border-radius: 28px;
    border: none;
    background: var(--surface-high);
    font-size: 1rem;
    color: var(--on-surface);
    outline: 2px solid transparent;
    outline-offset: -2px;
    transition: outline-color 0.2s var(--ease);
  }
  .input-wrap input[type="text"]:focus { outline-color: var(--primary); }
  .input-wrap input[type="text"]::placeholder { color: var(--on-surface-variant); }
  .add-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 50%;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
    transition: box-shadow 0.2s var(--ease);
  }
  .add-btn:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15); }

  /* ── Chips: priority + filters ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1rem;
  }
  .priority-btn, .filter-btn {
    height: 32px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--outline);
    background: transparent;
    color: var(--on-surface-variant);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.1px;
    cursor: pointer;
    transition: background 0.2s var(--ease), color 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .priority-btn:hover, .filter-btn:hover { background: rgba(29, 27, 32, 0.08); }
  .priority-btn.active-low, .priority-btn.active-mid, .priority-btn.active-high,
  .filter-btn.active { border-color: transparent; }
  .priority-btn.active-low::before, .priority-btn.active-mid::before,
  .priority-btn.active-high::before, .filter-btn.active::before {
    content: '\2713';
    margin-right: 6px;
    font-size: 0.8rem;
  }
  .priority-btn.active-low  { background: var(--low-c);  color: var(--on-low-c);  }
  .priority-btn.active-mid  { background: var(--mid-c);  color: var(--on-mid-c);  }
  .priority-btn.active-high { background: var(--high-c); color: var(--on-high-c); }
  .filter-btn.active { background: var(--secondary-container); color: var(--on-secondary-container); }
  .divider { display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.5rem; }

  /* ── Task list ── */
  ul {
    list-style: none;
    max-height: calc(100vh - 470px);
    min-height: 120px;
    overflow-y: auto;
    margin-top: 0.25rem;
  }
  ul::-webkit-scrollbar { width: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 56px;
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    animation: fadeUp 0.2s ease both;
    transition: opacity 0.22s ease, transform 0.22s ease, background 0.15s;
  }
  li:hover { background: rgba(29, 27, 32, 0.06); }
  li.drag-over { box-shadow: inset 0 2px 0 var(--primary); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  li.completing { opacity: 0 !important; transform: scale(0.97) !important; }
  li.done { opacity: 0.6; }
  li.done .task-text { text-decoration: line-through; color: var(--on-surface-variant); }
  li.done .check-circle { background: var(--primary); border-color: var(--primary); }
  li.done .check-circle::after { opacity: 1; transform: translate(-50%, -62%) rotate(45deg) scale(1); }
  .check-circle {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    border: 2px solid var(--on-surface-variant);
    flex-shrink: 0;
    position: relative;
    transition: background 0.2s, border-color 0.2s;
  }
  .check-circle::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 10px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: translate(-50%, -62%) rotate(45deg) scale(0);
    opacity: 0;
    transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
  }
  .p-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-dot.high { background: var(--high); }
  .p-dot.mid  { background: var(--mid);  }
  .p-dot.low  { background: var(--low);  }
  .task-text {
    flex: 1;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.15px;
    word-break: break-word;
    line-height: 1.5;
    color: var(--on-surface);
    transition: color 0.2s;
  }
  .delete-btn, .note-delete-btn {
    background: transparent;
    color: var(--on-surface-variant);
    border: none;
    width: 32px;
    height: 32px;
    font-size: 0.8rem;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  li:hover .delete-btn, .note-row:hover .note-delete-btn { opacity: 1; }
  .delete-btn:hover, .note-delete-btn:hover { background: rgba(179, 38, 30, 0.1); color: var(--error); }
  @media (hover: none) { .delete-btn, .note-delete-btn { opacity: 1; } }
  .empty-state {
    padding: 2.5rem 0 1.5rem;
    color: var(--on-surface-variant);
    font-size: 0.875rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  /* ── Footer ── */
  .footer-row, .notes-footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.75rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--outline-variant);
    min-height: 48px;
  }
  .task-counter, .notes-counter {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--on-surface-variant);
    padding-left: 0.5rem;
  }
  .footer-actions { display: flex; gap: 4px; }

  /* ── Text buttons ── */
  .ghost-btn {
    height: 40px;
    padding: 0 14px;
    background: none;
    border: none;
    color: var(--primary);
    border-radius: 20px;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.1px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ghost-btn:hover { background: rgba(103, 80, 164, 0.08); }
  .ghost-btn.active { background: var(--secondary-container); color: var(--on-secondary-container); }
  .ghost-btn.danger { color: var(--error); }
  .ghost-btn.danger:hover { background: rgba(179, 38, 30, 0.08); }
  #clear-btn { display: none; }
  #clear-btn.visible { display: block; }

  /* ── Snackbar ── */
  .toast {
    position: fixed;
    bottom: 1.25rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #322F35;
    color: #F5EFF7;
    padding: 4px 8px 4px 16px;
    min-height: 48px;
    border-radius: 4px;
    font-size: 0.875rem;
    letter-spacing: 0.25px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 3px 5px rgba(0,0,0,0.25), 0 1px 18px rgba(0,0,0,0.12);
    transition: transform 0.28s var(--ease);
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast-undo {
    background: none;
    border: none;
    color: #D0BCFF;
    height: 40px;
    padding: 0 12px;
    border-radius: 20px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
  }
  .toast-undo:hover { background: rgba(208, 188, 255, 0.12); }

  /* ══ NOTES ══ */
  .note-add-row {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    padding: 0 20px;
    border-radius: var(--radius);
    border: none;
    background: var(--primary-container);
    color: var(--on-primary-container);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.1px;
    cursor: pointer;
    width: 100%;
    text-align: left;
    margin-bottom: 0.75rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
    transition: box-shadow 0.2s var(--ease);
  }
  .note-add-row:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15); }

  .notes-filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.5rem; }
  .note-filter-btn {
    height: 32px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--outline);
    background: transparent;
    color: var(--on-surface-variant);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.1px;
    cursor: pointer;
    transition: background 0.2s var(--ease), color 0.2s var(--ease);
  }
  .note-filter-btn:hover { background: rgba(29, 27, 32, 0.08); }
  .note-filter-btn.active {
    border-color: transparent;
    background: var(--secondary-container);
    color: var(--on-secondary-container);
  }
  .note-filter-btn.active::before { content: '\2713'; margin-right: 6px; font-size: 0.8rem; }

  .notes-scroll {
    max-height: calc(100vh - 470px);
    min-height: 120px;
    overflow-y: auto;
    margin-top: 0.25rem;
  }
  .notes-scroll::-webkit-scrollbar { width: 0; }
  .note-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 8px 8px 8px 16px;
    border-radius: var(--radius-sm);
    background: var(--surface-low);
    margin-bottom: 8px;
    cursor: pointer;
    animation: fadeUp 0.2s ease both;
    transition: opacity 0.18s, background 0.15s;
  }
  .note-row:hover { background: var(--surface-mid); }
  .note-row.archived { opacity: 0.5; }
  .note-row-title {
    flex: 1;
    font-size: 1rem;
    font-weight: 500;
    color: var(--on-surface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-row-preview {
    font-size: 0.8rem;
    color: var(--on-surface-variant);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 110px;
    flex-shrink: 0;
  }

  #note-editor-view { animation: fadeUp 0.18s ease both; }
  .note-editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 0.5rem;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid var(--outline-variant);
  }
  #note-title-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 2rem;
    color: var(--on-surface);
    outline: none;
    margin-bottom: 0.5rem;
    padding: 0 0 8px;
    border-bottom: 1px solid var(--outline-variant);
    transition: border-color 0.2s;
  }
  #note-title-input:focus { border-bottom: 2px solid var(--primary); padding-bottom: 7px; }
  #note-title-input::placeholder { color: var(--on-surface-variant); }
  #note-body-input {
    width: 100%;
    min-height: 220px;
    border: none;
    background: transparent;
    font-size: 1rem;
    letter-spacing: 0.3px;
    color: var(--on-surface);
    outline: none;
    resize: none;
    line-height: 1.6;
    padding: 0;
    margin-top: 0.5rem;
  }
  #note-body-input::placeholder { color: var(--on-surface-variant); }

  .footer-credit {
    position: fixed;
    bottom: 1.5rem;
    width: 100%;
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.4px;
    color: var(--outline);
    pointer-events: none;
    z-index: 1;
  }

  @media (min-width: 600px) {
    body { padding: 3rem 1rem 5rem; background: var(--surface-high); }
    .container {
      max-width: 440px;
      min-height: unset;
      border-radius: 28px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
    }
    ul, .notes-scroll { max-height: calc(100vh - 530px); }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>My Day</h1>
      <div class="date" id="date-display"></div>
    </div>
    <div class="clock-block">
      <div class="clock-time" id="clock-time"></div>
      <div class="seconds-bar-track">
        <div class="seconds-bar-fill" id="seconds-bar"></div>
      </div>
    </div>
  </div>

  <!-- App tabs -->
  <div class="app-tabs">
    <button class="app-tab active" onclick="switchApp('tasks')">Tasks</button>
    <button class="app-tab"        onclick="switchApp('notes')">Notes</button>
  </div>

  <!-- ══ TASKS VIEW ══ -->
  <div id="tasks-view">
    <div class="input-wrap">
      <input type="text" id="task-input" placeholder="Add a task..." maxlength="80" autocomplete="off">
      <button class="add-btn" onclick="addTask()" title="Add (Enter)">+</button>
    </div>
    <div class="divider"></div>
    <div class="filters">
      <button class="filter-btn active" data-f="all"    onclick="setFilter('all')">All <span id="cnt-all"></span></button>
      <button class="filter-btn"        data-f="active" onclick="setFilter('active')">Active <span id="cnt-active"></span></button>
      <button class="filter-btn"        data-f="done"   onclick="setFilter('done')">Done <span id="cnt-done"></span></button>
    </div>
    <ul id="task-list"></ul>
    <div class="footer-row">
      <span class="task-counter" id="task-counter"></span>
      <div class="footer-actions">
        <button class="ghost-btn danger" id="clear-btn" onclick="clearDone()">Clear done</button>
      </div>
    </div>
  </div>

  <!-- ══ NOTES VIEW ══ -->
  <div id="notes-view" style="display:none;">

    <!-- Notes list -->
    <div id="notes-list-view">
      <button class="note-add-row" onclick="newNote()">+ New note...</button>
      <div class="divider"></div>
      <div class="notes-filter-row">
        <button class="note-filter-btn active" data-nf="all"      onclick="setNoteFilter('all')">All <span id="ncnt-all"></span></button>
        <button class="note-filter-btn"        data-nf="active"   onclick="setNoteFilter('active')">Active <span id="ncnt-active"></span></button>
        <button class="note-filter-btn"        data-nf="archived" onclick="setNoteFilter('archived')">Archived <span id="ncnt-archived"></span></button>
      </div>
      <div class="notes-scroll" id="notes-list"></div>
      <div class="notes-footer-row">
        <span class="notes-counter" id="notes-counter"></span>
        <div class="footer-actions">
          <button class="ghost-btn danger" id="clear-archived-btn" onclick="clearArchived()" style="display:none;">Clear archived</button>
        </div>
      </div>
    </div>

    <!-- Note editor -->
    <div id="note-editor-view" style="display:none;">
      <div class="note-editor-topbar">
        <button class="ghost-btn" onclick="closeEditor()">← Back</button>
        <div style="display:flex;gap:6px;">
          <button class="ghost-btn" id="archive-toggle-btn" onclick="toggleArchiveCurrent()">Archive</button>
          <button class="ghost-btn danger" onclick="deleteCurrentNote()">Delete</button>
        </div>
      </div>
      <input type="text" id="note-title-input" placeholder="Note title..." maxlength="60" autocomplete="off">
      <textarea id="note-body-input" placeholder="Start writing..."></textarea>
    </div>

  </div>
</div>

<div class="toast" id="toast">
  Task removed
  <button class="toast-undo" onclick="undoDelete()">Undo</button>
</div>

<div class="footer-credit">© 2026 Surajit Laskar</div>
<div id="stats-bar" style="text-align:center;font-size:0.72rem;color:#79747E;position:fixed;bottom:0.25rem;width:100%;pointer-events:none;z-index:1;"></div>

<script>
// ══════════════════════════════════════
// TASKS
// ══════════════════════════════════════
var tasks            = JSON.parse(localStorage.getItem('myDay_tasks') || '[]');
var selectedPriority = 'low';
var activeFilter     = 'all';
var sortByPriority   = false;
var deletedTask      = null;
var deletedIndex     = null;
var toastTimer       = null;
var priorityOrder    = { high: 0, mid: 1, low: 2 };
var dragSrcId        = null;

function save() { localStorage.setItem('myDay_tasks', JSON.stringify(tasks)); }

function selectPriority(p) {
  selectedPriority = p;
  document.querySelectorAll('.priority-btn').forEach(function(btn) {
    btn.className = 'priority-btn';
    if (btn.dataset.p === p) btn.classList.add('active-' + p);
  });
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.f === f);
  });
  render();
}

function toggleSort() {
  sortByPriority = !sortByPriority;
  document.getElementById('sort-btn').classList.toggle('active', sortByPriority);
  render();
}

function addTask() {
  var input = document.getElementById('task-input');
  var text  = input.value.trim();
  if (!text) return;
  tasks.push({ text: text, priority: selectedPriority, done: false, id: Date.now() });
  input.value = '';
  input.focus();
  save(); render();
}

function toggleTask(id) {
  var li = document.querySelector('li[data-id="' + id + '"]');
  if (!li) return;
  var t = tasks.find(function(t) { return t.id === id; });
  li.classList.add('completing');
  setTimeout(function() {
    if (t) { t.done = !t.done; if (t.done) trackCompletion(); save(); render(); }
  }, 200);
}

function editTask(id, el) {
  var t = tasks.find(function(t) { return t.id === id; });
  if (!t || t.done) return;
  var prev = t.text;
  el.contentEditable = 'true';
  el.focus();
  var range = document.createRange();
  range.selectNodeContents(el);
  var sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  el.style.outline = 'none';
  el.style.borderBottom = '1.5px solid var(--accent)';
  el.style.paddingBottom = '1px';
  function finish(cancel) {
    el.contentEditable = 'false';
    el.style.borderBottom = '';
    el.style.paddingBottom = '';
    var newText = el.textContent.trim();
    if (cancel || !newText) { el.textContent = prev; return; }
    t.text = newText; save();
  }
  el.onblur = function() { finish(false); };
  el.onkeydown = function(e) {
    if (e.key === 'Enter') { e.preventDefault(); finish(false); }
    if (e.key === 'Escape') { finish(true); }
  };
}

function deleteTask(id, e) {
  e.stopPropagation();
  var idx = tasks.findIndex(function(t) { return t.id === id; });
  if (idx === -1) return;
  deletedTask = tasks[idx]; deletedIndex = idx;
  tasks.splice(idx, 1);
  save(); render(); showToast();
}

function reorderTask(srcId, targetId) {
  if (srcId === targetId) return;
  var srcIdx    = tasks.findIndex(function(t) { return t.id === srcId; });
  var targetIdx = tasks.findIndex(function(t) { return t.id === targetId; });
  if (srcIdx === -1 || targetIdx === -1) return;
  var moved = tasks.splice(srcIdx, 1)[0];
  tasks.splice(targetIdx, 0, moved);
  save(); render();
}

function trackCompletion() {
  var stats = JSON.parse(localStorage.getItem('myDay_stats') || '{}');
  var today = new Date().toISOString().slice(0, 10);
  stats[today] = (stats[today] || 0) + 1;
  localStorage.setItem('myDay_stats', JSON.stringify(stats));
}

function getStats() {
  var stats = JSON.parse(localStorage.getItem('myDay_stats') || '{}');
  var today = new Date().toISOString().slice(0, 10);
  var todayCount = stats[today] || 0;
  var total = Object.values(stats).reduce(function(a,b){ return a+b; }, 0);
  var days = Object.keys(stats).length;
  return { today: todayCount, total: total, days: days };
}

function undoDelete() {
  if (!deletedTask) return;
  tasks.splice(deletedIndex, 0, deletedTask);
  deletedTask = null;
  save(); render(); hideToast();
}

function showToast() {
  clearTimeout(toastTimer);
  document.getElementById('toast').classList.add('show');
  toastTimer = setTimeout(hideToast, 4000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }
function clearDone() { tasks = tasks.filter(function(t) { return !t.done; }); save(); render(); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  var list = document.getElementById('task-list');
  list.innerHTML = '';
  var total  = tasks.length;
  var active = tasks.filter(function(t){ return !t.done; }).length;
  var done   = tasks.filter(function(t){ return t.done; }).length;
  document.getElementById('cnt-all').textContent    = total  ? '('+total+')'  : '';
  document.getElementById('cnt-active').textContent = active ? '('+active+')' : '';
  document.getElementById('cnt-done').textContent   = done   ? '('+done+')'   : '';
  document.getElementById('task-counter').textContent = total === 0 ? '' : (active + ' of ' + total + ' remaining');
  document.getElementById('clear-btn').classList.toggle('visible', done > 0);
  var visible = tasks.slice();
  if (activeFilter === 'active') visible = visible.filter(function(t){ return !t.done; });
  if (activeFilter === 'done')   visible = visible.filter(function(t){ return t.done; });
  if (sortByPriority) visible.sort(function(a,b){ return priorityOrder[a.priority]-priorityOrder[b.priority]; });
  if (visible.length === 0) {
    var icons = {
      all:    '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 12l2 2 4-4"/></svg>',
      active: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
      done:   '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg>'
    };
    var msgs = { all: 'No tasks yet.', active: 'All caught up.', done: 'Nothing completed yet.' };
    list.innerHTML = '<div class="empty-state">'+icons[activeFilter]+'<div>'+msgs[activeFilter]+'</div></div>';
    return;
  }
  visible.forEach(function(task) {
    var li = document.createElement('li');
    li.dataset.id = task.id;
    li.dataset.p  = task.priority;
    if (task.done) li.classList.add('done');
    li.draggable = true;
    li.onclick = function() { toggleTask(task.id); };
    li.ondragstart = function() { li.classList.add('dragging'); dragSrcId = task.id; };
    li.ondragend   = function() { li.classList.remove('dragging'); document.querySelectorAll('li.drag-over').forEach(function(el){ el.classList.remove('drag-over'); }); };
    li.ondragover  = function(e) { e.preventDefault(); document.querySelectorAll('li.drag-over').forEach(function(el){ el.classList.remove('drag-over'); }); li.classList.add('drag-over'); };
    li.ondrop      = function(e) { e.preventDefault(); reorderTask(dragSrcId, task.id); };
    li.innerHTML =
      '<div class="check-circle"></div>' +
      '<span class="task-text" ondblclick="editTask('+task.id+',this)">'+esc(task.text)+'</span>' +
      '<button class="delete-btn" onclick="deleteTask('+task.id+',event)" title="Delete">&#x2715;</button>';
    list.appendChild(li);
  });
  updateStats();
}

function updateStats() {
  var s = getStats();
  var el = document.getElementById('stats-bar');
  if (!el) return;
  if (s.total === 0) { el.textContent = ''; return; }
  el.textContent = s.today + ' done today · ' + s.total + ' total across ' + s.days + ' day' + (s.days===1?'':'s');
}

// ══════════════════════════════════════
// NOTES
// ══════════════════════════════════════
var notes         = JSON.parse(localStorage.getItem('myDay_notes') || '[]');
var currentNoteId = null;
var noteFilter    = 'all';

notes = notes.map(function(n) {
  if (!n.category) n.category = 'personal';
  if (n.archived === undefined) n.archived = false;
  return n;
});

function saveNotes() { localStorage.setItem('myDay_notes', JSON.stringify(notes)); }

function setNoteFilter(f) {
  noteFilter = f;
  document.querySelectorAll('.note-filter-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.nf === f);
  });
  renderNotes();
}
function newNote() {
  var note = { id: Date.now(), title: '', body: '', category: 'personal', archived: false, updated: Date.now() };
  notes.unshift(note);
  saveNotes();
  openNote(note.id);
}

function openNote(id) {
  currentNoteId = id;
  var note = notes.find(function(n){ return n.id === id; });
  if (!note) return;
  document.getElementById('note-title-input').value = note.title;
  document.getElementById('note-body-input').value  = note.body;
  document.getElementById('archive-toggle-btn').textContent = note.archived ? 'Unarchive' : 'Archive';
  document.getElementById('notes-list-view').style.display  = 'none';
  document.getElementById('note-editor-view').style.display = '';
  document.getElementById('note-title-input').focus();
}

function closeEditor() {
  var note = notes.find(function(n){ return n.id === currentNoteId; });
  if (note) {
    note.title   = document.getElementById('note-title-input').value.trim();
    note.body    = document.getElementById('note-body-input').value.trim();
    note.updated = Date.now();
    if (!note.title && !note.body) {
      notes = notes.filter(function(n){ return n.id !== currentNoteId; });
    }
    saveNotes();
  }
  currentNoteId = null;
  document.getElementById('note-editor-view').style.display  = 'none';
  document.getElementById('notes-list-view').style.display   = '';
  renderNotes();
}

function toggleArchiveCurrent() {
  var note = notes.find(function(n){ return n.id === currentNoteId; });
  if (!note) return;
  note.title   = document.getElementById('note-title-input').value.trim();
  note.body    = document.getElementById('note-body-input').value.trim();
  note.updated = Date.now();
  note.archived = !note.archived;
  saveNotes();
  document.getElementById('archive-toggle-btn').textContent = note.archived ? 'Unarchive' : 'Archive';
}

function deleteCurrentNote() {
  notes = notes.filter(function(n){ return n.id !== currentNoteId; });
  saveNotes();
  currentNoteId = null;
  document.getElementById('note-editor-view').style.display  = 'none';
  document.getElementById('notes-list-view').style.display   = '';
  renderNotes();
}

function clearArchived() {
  notes = notes.filter(function(n){ return !n.archived; });
  saveNotes();
  renderNotes();
}

function renderNotes() {
  var list = document.getElementById('notes-list');
  list.innerHTML = '';
  var total    = notes.length;
  var active   = notes.filter(function(n){ return !n.archived; }).length;
  var archived = notes.filter(function(n){ return n.archived; }).length;
  document.getElementById('ncnt-all').textContent      = total    ? '('+total+')'    : '';
  document.getElementById('ncnt-active').textContent   = active   ? '('+active+')'   : '';
  document.getElementById('ncnt-archived').textContent = archived ? '('+archived+')' : '';
  document.getElementById('notes-counter').textContent = total === 0 ? '' : (active + ' active · ' + archived + ' archived');
  var clearBtn = document.getElementById('clear-archived-btn');
  clearBtn.style.display = archived > 0 ? '' : 'none';

  var visible = notes.slice();
  if (noteFilter === 'active')   visible = visible.filter(function(n){ return !n.archived; });
  if (noteFilter === 'archived') visible = visible.filter(function(n){ return n.archived; });

  if (visible.length === 0) {
    var msgs = { all: 'No notes yet.', active: 'All notes archived.', archived: 'Nothing archived.' };
    list.innerHTML = '<div class="empty-state"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div>'+msgs[noteFilter]+'</div></div>';
    return;
  }

  visible.forEach(function(note) {
    var row = document.createElement('div');
    row.className = 'note-row' + (note.archived ? ' archived' : '');
    row.innerHTML =
      '<span class="note-row-title">'+esc(note.title || 'Untitled')+'</span>' +
      '<span class="note-row-preview">'+esc(note.body || '')+'</span>' +
      '<button class="note-delete-btn" onclick="deleteNoteRow('+note.id+',event)" title="Delete">&#x2715;</button>';

    row.onclick = function(e) {
      if (e.target.classList.contains('archive-circle') || e.target.classList.contains('note-delete-btn')) return;
      openNote(note.id);
    };
    list.appendChild(row);
  });
}

function deleteNoteRow(id, e) {
  e.stopPropagation();
  notes = notes.filter(function(n){ return n.id !== id; });
  saveNotes();
  renderNotes();
}

// ══════════════════════════════════════
// APP SWITCHER
// ══════════════════════════════════════
var activeApp = 'tasks';

function switchApp(app) {
  activeApp = app;
  document.querySelectorAll('.app-tab').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.toLowerCase().trim() === app);
  });
  document.getElementById('tasks-view').style.display = app === 'tasks' ? '' : 'none';
  document.getElementById('notes-view').style.display = app === 'notes' ? '' : 'none';
  if (app === 'notes') renderNotes();
}

// ══════════════════════════════════════
// CLOCK & DATE
// ══════════════════════════════════════
function setDate() {
  document.getElementById('date-display').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function updateClock() {
  var now  = new Date();
  var hrs  = now.getHours();
  var h    = String(hrs % 12 || 12).padStart(2, '0');
  var m    = String(now.getMinutes()).padStart(2, '0');
  var s    = String(now.getSeconds()).padStart(2, '0');
  var ampm = hrs >= 12 ? 'PM' : 'AM';
  document.getElementById('clock-time').textContent = h+':'+m+':'+s+' '+ampm;
  document.getElementById('seconds-bar').style.width = ((now.getSeconds()/60)*100)+'%';
}

// ══════════════════════════════════════
// RIPPLE (touch feedback)
// ══════════════════════════════════════
document.addEventListener('pointerdown', function(e) {
  var t = e.target.closest && e.target.closest('.app-tab,.priority-btn,.filter-btn,.note-filter-btn,.ghost-btn,.add-btn,.note-add-row,.toast-undo,li,.note-row');
  if (!t) return;
  var r = t.getBoundingClientRect();
  var size = Math.max(r.width, r.height) * 2;
  var s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = size + 'px';
  s.style.left = (e.clientX - r.left - size / 2) + 'px';
  s.style.top  = (e.clientY - r.top  - size / 2) + 'px';
  t.appendChild(s);
  setTimeout(function() { if (s.parentNode) s.parentNode.removeChild(s); }, 600);
});

// ══════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement.id === 'task-input') addTask();
  if (e.altKey && e.key === '1') { e.preventDefault(); selectPriority('low');  }
  if (e.altKey && e.key === '2') { e.preventDefault(); selectPriority('mid');  }
  if (e.altKey && e.key === '3') { e.preventDefault(); selectPriority('high'); }
  if (e.key === 'Escape' && currentNoteId !== null) closeEditor();
});

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
setDate();
render();
updateClock();
setInterval(updateClock, 1000);
</script>
